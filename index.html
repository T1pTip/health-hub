<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Health Hub - מורן</title>
<style>
/* ============================================================
   Moran's Health Hub - Single File PWA
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: 'Segoe UI', 'Heebo', system-ui, -apple-system, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-card-2: #334155;
  --accent: #10b981;
  --accent-2: #06b6d4;
  --accent-warn: #f59e0b;
  --accent-danger: #ef4444;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --border: #334155;
  --shadow: 0 4px 12px rgba(0,0,0,0.3);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea {
  font-family: inherit; background: var(--bg-card-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 15px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.app-header {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
}
.app-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.app-title .logo { font-size: 22px; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; background: var(--bg-card-2);
  display: grid; place-items: center; font-size: 18px; transition: background 0.15s;
}
.icon-btn:hover, .icon-btn:active { background: var(--accent); }
.tab-nav {
  display: flex; background: var(--bg-card); border-bottom: 1px solid var(--border);
  position: sticky; top: 64px; z-index: 90; overflow-x: auto;
}
.tab-btn {
  flex: 1; padding: 12px 8px; font-size: 13px; font-weight: 600; color: var(--text-dim);
  border-bottom: 3px solid transparent; transition: all 0.15s; white-space: nowrap; min-width: 80px;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn .emoji { font-size: 18px; display: block; margin-bottom: 2px; }
main { padding: 16px; max-width: 720px; margin: 0 auto; }
.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.card {
  background: var(--bg-card); border-radius: 14px; padding: 16px; margin-bottom: 14px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.card-title { font-size: 16px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title .emoji { font-size: 20px; }
.card-subtitle { font-size: 13px; color: var(--text-dim); margin: -8px 0 12px; }
.status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0; }
.status-tile { background: var(--bg-card-2); border-radius: 10px; padding: 12px; text-align: center; }
.status-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.status-value { font-size: 22px; font-weight: 700; color: var(--accent); }
.status-unit { font-size: 12px; color: var(--text-dim); margin-right: 2px; }
.status-trend { font-size: 11px; margin-top: 2px; }
.status-trend.up { color: #ef4444; }
.status-trend.down { color: var(--accent); }
.status-trend.flat { color: var(--text-dim); }
.btn {
  background: var(--accent); color: white; border-radius: 10px; padding: 12px 16px; font-size: 15px;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.1s, opacity 0.15s; width: 100%; margin-bottom: 8px;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.secondary { background: var(--bg-card-2); }
.btn.danger { background: var(--accent-danger); }
.btn.warn { background: var(--accent-warn); color: #0f172a; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { margin-bottom: 0; }
.day-card { background: var(--bg-card-2); border-radius: 10px; padding: 12px; margin-bottom: 10px; border-right: 4px solid var(--accent); }
.day-card.training { border-right-color: var(--accent-2); }
.day-card.release { border-right-color: var(--accent-warn); }
.day-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.day-name .badge { font-size: 10px; background: var(--accent-2); color: white; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
.day-name .badge.release { background: var(--accent-warn); color: #0f172a; }
.meal-row { font-size: 13px; margin: 4px 0; display: flex; gap: 6px; }
.meal-row .meal-label { color: var(--text-dim); flex-shrink: 0; min-width: 60px; }
.macros-row { display: flex; gap: 10px; margin-top: 8px; font-size: 11px; color: var(--text-dim); }
.macros-row span { background: var(--bg); padding: 3px 8px; border-radius: 6px; }
.pantry-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
.pantry-chip {
  background: var(--bg-card-2); padding: 8px 10px; border-radius: 8px; font-size: 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  cursor: pointer; transition: all 0.15s; border: 1px solid transparent;
}
.pantry-chip.in-stock { background: var(--bg-card-2); border-color: var(--accent); }
.pantry-chip.out-stock { opacity: 0.4; text-decoration: line-through; }
.pantry-chip .check { font-size: 14px; }
.workout-day { background: var(--bg-card-2); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.workout-day.release { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; }
.workout-day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg-card); border-radius: 16px; padding: 20px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 18px; font-weight: 700; margin: 0; }
.modal-close { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-card-2); display: grid; place-items: center; font-size: 18px; }
.form-row { margin-bottom: 12px; }
.form-label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
.ai-panel { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--accent); }
.ai-persona { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ai-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
.ai-avatar.trainer { background: var(--accent-2); }
.ai-name { font-weight: 700; font-size: 15px; }
.ai-role { font-size: 12px; color: var(--text-dim); }
.history-item { background: var(--bg-card-2); border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; border-right: 3px solid var(--accent); }
.history-item.trainer { border-right-color: var(--accent-2); }
.history-date { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.history-preview { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini-chart { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin-top: 10px; }
.mini-chart .bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 4px; opacity: 0.7; transition: opacity 0.2s; }
.mini-chart .bar:last-child { opacity: 1; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; z-index: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: toastIn 0.3s; max-width: 90%; text-align: center; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
.hint-box { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--accent-warn); border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.5; }
.hint-box strong { color: var(--accent-warn); }
.empty-state { text-align: center; padding: 30px 20px; color: var(--text-dim); }
.empty-state .emoji { font-size: 40px; display: block; margin-bottom: 10px; }
.photo-preview { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); }
.text-dim { color: var(--text-dim); }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.hidden { display: none !important; }
@media (max-width: 480px) {
  .status-grid { grid-template-columns: repeat(2, 1fr); }
  main { padding: 12px; }
  .card { padding: 14px; border-radius: 12px; }
}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-title"><span class="logo">💪</span><span>Health Hub</span></div>
  <div class="header-actions">
    <button class="icon-btn" id="btnHistory" title="היסטוריית הנחיות">📜</button>
    <button class="icon-btn" id="btnSettings" title="הגדרות">⚙️</button>
  </div>
</header>
<nav class="tab-nav">
  <button class="tab-btn active" data-screen="dashboard"><span class="emoji">🏠</span>דשבורד</button>
  <button class="tab-btn" data-screen="menu"><span class="emoji">🍽️</span>תפריט</button>
  <button class="tab-btn" data-screen="workouts"><span class="emoji">🏋️</span>אימונים</button>
  <button class="tab-btn" data-screen="metrics"><span class="emoji">📊</span>מדדים</button>
  <button class="tab-btn" data-screen="blood"><span class="emoji">🩸</span>דם</button>
</nav>
<main>
  <section class="screen active" id="screen-dashboard"><div id="dashboardContent"></div></section>
  <section class="screen" id="screen-menu"><div id="menuContent"></div></section>
  <section class="screen" id="screen-workouts"><div id="workoutsContent"></div></section>
  <section class="screen" id="screen-metrics"><div id="metricsContent"></div></section>
  <section class="screen" id="screen-blood"><div id="bloodContent"></div></section>
</main>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<script type="module" src="./app.js"></script>
</body>
</html>

<title>Health Hub - מורן</title>
<style>
/* ============================================================
   Moran's Health Hub - Single File PWA
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: 'Segoe UI', 'Heebo', system-ui, -apple-system, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-card-2: #334155;
  --accent: #10b981;        /* ירוק בריאות */
  --accent-2: #06b6d4;      /* תכלת מים */
  --accent-warn: #f59e0b;
  --accent-danger: #ef4444;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --border: #334155;
  --shadow: 0 4px 12px rgba(0,0,0,0.3);
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}
input, select, textarea {
  font-family: inherit;
  background: var(--bg-card-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 15px;
  width: 100%;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--accent);
  border-color: var(--accent);
}

/* Header */
.app-header {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-title {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.app-title .logo { font-size: 22px; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--bg-card-2);
  display: grid;
  place-items: center;
  font-size: 18px;
  transition: background 0.15s;
}
.icon-btn:hover, .icon-btn:active { background: var(--accent); }

/* Tab nav */
.tab-nav {
  display: flex;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 64px;
  z-index: 90;
  overflow-x: auto;
}
.tab-btn {
  flex: 1;
  padding: 12px 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  border-bottom: 3px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  min-width: 80px;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab-btn .emoji { font-size: 18px; display: block; margin-bottom: 2px; }

/* Main */
main {
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}
.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.2s; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards */
.card {
  background: var(--bg-card);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card-title .emoji { font-size: 20px; }
.card-subtitle {
  font-size: 13px;
  color: var(--text-dim);
  margin: -8px 0 12px;
}

/* Status grid */
.status-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 10px 0;
}
.status-tile {
  background: var(--bg-card-2);
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}
.status-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.status-value { font-size: 22px; font-weight: 700; color: var(--accent); }
.status-unit { font-size: 12px; color: var(--text-dim); margin-right: 2px; }
.status-trend { font-size: 11px; margin-top: 2px; }
.status-trend.up { color: #ef4444; }
.status-trend.down { color: var(--accent); }
.status-trend.flat { color: var(--text-dim); }

/* Buttons */
.btn {
  background: var(--accent);
  color: white;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.1s, opacity 0.15s;
  width: 100%;
  margin-bottom: 8px;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.secondary { background: var(--bg-card-2); }
.btn.danger { background: var(--accent-danger); }
.btn.warn { background: var(--accent-warn); color: #0f172a; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { margin-bottom: 0; }

/* Menu items */
.day-card {
  background: var(--bg-card-2);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  border-right: 4px solid var(--accent);
}
.day-card.training { border-right-color: var(--accent-2); }
.day-card.release { border-right-color: var(--accent-warn); }
.day-name {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.day-name .badge {
  font-size: 10px;
  background: var(--accent-2);
  color: white;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 500;
}
.day-name .badge.release { background: var(--accent-warn); color: #0f172a; }
.meal-row {
  font-size: 13px;
  margin: 4px 0;
  display: flex;
  gap: 6px;
}
.meal-row .meal-label {
  color: var(--text-dim);
  flex-shrink: 0;
  min-width: 60px;
}
.macros-row {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-dim);
}
.macros-row span { background: var(--bg); padding: 3px 8px; border-radius: 6px; }

/* Pantry */
.pantry-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-top: 8px;
}
.pantry-chip {
  background: var(--bg-card-2);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.pantry-chip.in-stock { background: var(--bg-card-2); border-color: var(--accent); }
.pantry-chip.out-stock { opacity: 0.4; text-decoration: line-through; }
.pantry-chip .check { font-size: 14px; }

/* Workout */
.workout-day {
  background: var(--bg-card-2);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.workout-day.release { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; }
.workout-day-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-weight: 700;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 20px;
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid var(--border);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-title { font-size: 18px; font-weight: 700; margin: 0; }
.modal-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--bg-card-2);
  display: grid;
  place-items: center;
  font-size: 18px;
}

/* Form rows */
.form-row {
  margin-bottom: 12px;
}
.form-label {
  display: block;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

/* AI panel */
.ai-panel {
  background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  border: 1px solid var(--accent);
}
.ai-persona {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.ai-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent);
  display: grid;
  place-items: center;
  font-size: 22px;
  flex-shrink: 0;
}
.ai-avatar.trainer { background: var(--accent-2); }
.ai-name { font-weight: 700; font-size: 15px; }
.ai-role { font-size: 12px; color: var(--text-dim); }

/* History list */
.history-item {
  background: var(--bg-card-2);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  border-right: 3px solid var(--accent);
}
.history-item.trainer { border-right-color: var(--accent-2); }
.history-date {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.history-preview {
  font-size: 13px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Chart placeholder */
.mini-chart {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 60px;
  margin-top: 10px;
}
.mini-chart .bar {
  flex: 1;
  background: var(--accent);
  border-radius: 3px 3px 0 0;
  min-height: 4px;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.mini-chart .bar:last-child { opacity: 1; }

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: white;
  padding: 12px 20px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 600;
  z-index: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  animation: toastIn 0.3s;
  max-width: 90%;
  text-align: center;
}
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 20px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* Onboarding hint */
.hint-box {
  background: rgba(245, 158, 11, 0.1);
  border: 1px solid var(--accent-warn);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 14px;
  font-size: 13px;
  line-height: 1.5;
}
.hint-box strong { color: var(--accent-warn); }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-dim);
}
.empty-state .emoji { font-size: 40px; display: block; margin-bottom: 10px; }

/* Photo preview */
.photo-preview {
  max-width: 100%;
  border-radius: 10px;
  margin-top: 10px;
  border: 1px solid var(--border);
}

/* Utility */
.text-dim { color: var(--text-dim); }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.hidden { display: none !important; }

/* Mobile tuning */
@media (max-width: 480px) {
  .status-grid { grid-template-columns: repeat(2, 1fr); }
  main { padding: 12px; }
  .card { padding: 14px; border-radius: 12px; }
}
</style>
</head>
<body>

<header class="app-header">

</nav>

<main>

  <section class="screen" id="screen-menu">

  </section>

  <!-- WORKOUTS -->
  <section class="screen" id="screen-workouts">
    <div id="workoutsContent"></div>
  </section>

  <!-- METRICS -->
  <section class="screen" id="screen-metrics">

</main>

<!-- Modal container -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

  function loadScript(src){
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[data-cdn="${src}"]`)){ resolve(); return; }
      const s = document.createElement('script');
      s.src = src;
      s.setAttribute('data-cdn', src);
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load: '+src));
      document.head.appendChild(s);
    });
  }

  async function ensurePdfJs(){
    if (window.pdfjsLib) return window.pdfjsLib;
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return window.pdfjsLib;
  }

  async function ensureTesseract(){
    if (window.Tesseract) return window.Tesseract;
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    return window.Tesseract;
  }

  /**
   * Extract text from a PDF URL using PDF.js (digital text) with OCR fallback (Tesseract.js + Hebrew).
   * Runs 100% in the browser - no backend required, no API costs.
   * @param {string} pdfUrl - URL to the PDF
   * @param {function} onProgress - Optional callback({phase, page, total, progress, status})
   * @returns {Promise<{method: 'pdfjs'|'ocr', text: string, pages: number}>}
   */
  async function extractTextFromPDF(pdfUrl, onProgress){
    const report = (info) => { try { onProgress && onProgress(info); } catch(_){} };
    report({phase:'fetch', status:'מוריד PDF...'});
    const pdfjs = await ensurePdfJs();
    const resp = await fetch(pdfUrl);
    if (!resp.ok) throw new Error('PDF fetch failed: '+resp.status);
    const buf = await resp.arrayBuffer();
    const pdf = await pdfjs.getDocument({data: buf}).promise;
    const numPages = pdf.numPages;

    // STEP 1: Try digital text extraction (works for non-scanned PDFs - instant, no OCR needed)
    report({phase:'pdfjs', status:'מנסה לחלץ טקסט דיגיטלי...', total:numPages});
    let digitalText = '';
    for (let i = 1; i <= numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(it => it.str).join(' ');
      if (pageText.trim()) digitalText += `\n=== עמוד ${i} ===\n${pageText}\n`;
    }
    if (digitalText.trim().length > 100){
      report({phase:'done', method:'pdfjs', length:digitalText.length});
      return { method:'pdfjs', text:digitalText, pages:numPages };
    }

    // STEP 2: Scanned PDF - render pages to canvas and run OCR
    report({phase:'ocr-init', status:'טוען מנוע OCR (טעינה ראשונה ~30מב)...'});
    const Tess = await ensureTesseract();
    let ocrText = '';
    for (let i = 1; i <= numPages; i++){
      report({phase:'ocr', page:i, total:numPages, status:`מעבד עמוד ${i}/${numPages}...`});
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({scale: 2.0}); // higher scale = better OCR accuracy
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({canvasContext: ctx, viewport}).promise;
      const result = await Tess.recognize(canvas, 'heb+eng', {
        logger: m => report({phase:'ocr', page:i, total:numPages, status:m.status, progress:m.progress})
      });
      ocrText += `\n=== עמוד ${i} ===\n${result.data.text}\n`;
    }
    report({phase:'done', method:'ocr', length:ocrText.length});
    return { method:'ocr', text:ocrText, pages:numPages };
  }

  /**
   * Extract text from an IMAGE file (scale screenshot) via Tesseract.js OCR (heb+eng).
   * No PDF.js needed - Tesseract reads the image directly. 100% client-side, no API cost.
   * Same engine as the blood-test OCR flow.
   */
  async function extractTextFromImage(file, onProgress){
    const report = (info) => { try { onProgress && onProgress(info); } catch(_){} };
    report({status:'טוען מנוע OCR...'});
    const Tess = await ensureTesseract();
    report({status:'מנתח תמונה...'});
    const result = await Tess.recognize(file, 'heb+eng', {
      logger: m => report({status:m.status, progress:m.progress})
    });
    return (result && result.data && result.data.text) || '';
  }

  /**
   * Parse smart-scale metrics from raw OCR text using keyword + numeric-range heuristics.
   * Returns only the keys it could confidently detect. OCR of LCD/app screens is imperfect,
   * so the user reviews & corrects the auto-filled fields before saving.
   */
  function parseScaleMetrics(rawText){
    const text = (rawText || '').replace(/[٫،]/g, '.'); // normalize odd commas to dots
    // Collapse internal whitespace per line but KEEP line structure: smart-scale apps lay
    // values and labels on SEPARATE lines in a grid, so we must look across adjacent lines.
    const lines = text.split(/\n+/).map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
    // Extract numeric tokens from a line, each with its column-center position + trailing unit.
    function numTokens(line){
      const toks = [];
      const re = /(\d{1,4}(?:\.\d{1,3})?)\s*(kg|%|kcal|keal)?/gi;
      let m;
      while ((m = re.exec(line)) !== null){
        const val = parseFloat(m[1]);
        if (isNaN(val)) continue;
        toks.push({ val: val, center: m.index + m[0].length / 2, unit: (m[2] || '').toLowerCase() });
      }
      return toks;
    }
    // Find a metric value: locate a label line, then read the number at the matching column
    // from the SAME line, the line ABOVE, or the line BELOW (in that order). Handles both
    // grid layouts (value sits above its label) and classic inline layouts (value same line).
    function valueFor(keywords, opts){
      const o = opts || {};
      const min = o.min != null ? o.min : -Infinity;
      const max = o.max != null ? o.max : Infinity;
      for (let i = 0; i < lines.length; i++){
        const low = lines[i].toLowerCase();
        let kpos = -1;
        for (const k of keywords){
          const idx = low.indexOf(k.toLowerCase());
          if (idx >= 0){ kpos = idx + k.length / 2; break; }
        }
        if (kpos < 0) continue;
        const cand = [lines[i]];
        if (i - 1 >= 0) cand.push(lines[i - 1]);
        if (i + 1 < lines.length) cand.push(lines[i + 1]);
        for (const cl of cand){
          let toks = numTokens(cl).filter(t => t.val >= min && t.val <= max);
          if (o.unit){ const u = toks.filter(t => t.unit === o.unit); if (u.length) toks = u; }
          if (!toks.length) continue;
          toks.sort((a, b) => Math.abs(a.center - kpos) - Math.abs(b.center - kpos));
          return o.integer ? Math.round(toks[0].val) : toks[0].val;
        }
      }
      return null;
    }
    const result = {};
    result.weight       = valueFor(['משקל','weight'], {min:25, max:250});
    result.body_fat_pct = valueFor(['שומן בגוף','אחוז שומן','body fat','שומן'], {min:2, max:65, unit:'%'});
    result.muscle_mass  = valueFor(['מסת שריר','muscle mass','שריר','muscle'], {min:15, max:120, unit:'kg'});
    result.water_pct    = valueFor(['אחוז מים','body water','מים','water'], {min:25, max:80, unit:'%'});
    result.visceral_fat = valueFor(['שומן בטני','בטני','visceral'], {min:1, max:59, integer:true});
    // Weight fallback: largest plausible 2-3 digit decimal anywhere (scale weight is the big number)
    if (result.weight == null){
      const nums = (text.match(/\d{2,3}\.\d/g) || []).map(parseFloat).filter(n => n >= 40 && n <= 200);
      if (nums.length) result.weight = nums.sort((a,b)=>b-a)[0];
    }
    Object.keys(result).forEach(k => { if (result[k] == null) delete result[k]; });
    return result;
  }

  /**
   * Full auto-OCR pipeline for the new-metric modal: image -> OCR -> parse -> fill fields.
   */
  async function runMetricOCR(file){
    const statusEl = document.getElementById('ocrStatus');
    const setStatus = (msg) => { if (statusEl){ statusEl.style.display='block'; statusEl.textContent = msg; } };
    try {
      setStatus('🔍 טוען מנוע OCR (פעם ראשונה ~30מב, סבלנות)...');
      const text = await extractTextFromImage(file, (p) => {
        if (p.status === 'recognizing text' && p.progress != null){
          setStatus(`🔍 מזהה טקסט... ${Math.round(p.progress*100)}%`);
        } else if (p.status){
          setStatus(`🔍 ${p.status}...`);
        }
      });
      const parsed = parseScaleMetrics(text);
      const map = {weight:'#mWeight', body_fat_pct:'#mBf', muscle_mass:'#mMm', water_pct:'#mWater', visceral_fat:'#mVf'};
      let filled = 0;
      Object.keys(map).forEach(k => {
        if (parsed[k] != null){ const el = $(map[k]); if (el){ el.value = parsed[k]; filled++; } }
      });
      const rawEl = document.getElementById('ocrRaw');
      if (rawEl){ rawEl.value = text; const wrap = document.getElementById('ocrRawWrap'); if (wrap) wrap.style.display='block'; }
      if (filled > 0){
        setStatus(`✅ זוהו ${filled}/5 ערכים אוטומטית — בדוק/תקן ולחץ שמור`);
        toast(`✅ ${filled} שדות מולאו מהתמונה`, 3000);
      } else {
        setStatus('⚠️ לא זוהו ערכים. בדוק את הטקסט שחולץ למטה ומלא ידנית, או נסה דרך Claude (למטה).');
        toast('⚠️ OCR לא זיהה ערכים — נסה fallback דרך Claude', 4000);
      }
    } catch(e){
      console.error('Metric OCR failed:', e);
      setStatus('⚠️ חילוץ נכשל: ' + (e.message||e) + ' — מלא ידנית או נסה דרך Claude.');
      toast('⚠️ OCR נכשל — fallback ל-Claude זמין למטה', 4000);
    }
  }

  // ============================================================
  // PRODUCT LABEL OCR (photo of a food package -> nutrition fields)
  // ============================================================
  // Upscale + grayscale + mild contrast before OCR -> sharper recognition of small printed
  // table text. Returns a canvas (Tesseract accepts it); on any failure resolves the raw file.
  function prepImageForOCR(file){
    return new Promise(function(resolve){
      try {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function(){
          try {
            var nw = img.naturalWidth || 0;
            var scale = 1;
            if (nw > 0 && nw < 1000) scale = Math.min(2, 2000 / nw);
            else if (nw > 2200) scale = 2200 / nw;
            var w = Math.round((nw || 1) * scale);
            var hh = Math.round((img.naturalHeight || 1) * scale);
            if (w < 1 || hh < 1){ URL.revokeObjectURL(url); resolve(file); return; }
            var cv = document.createElement('canvas');
            cv.width = w; cv.height = hh;
            var ctx = cv.getContext('2d');
            ctx.drawImage(img, 0, 0, w, hh);
            try {
              var id = ctx.getImageData(0, 0, w, hh);
              var d = id.data;
              for (var i = 0; i < d.length; i += 4){
                var g = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
                g = (g - 128) * 1.35 + 128;
                if (g < 0) g = 0;
                if (g > 255) g = 255;
                d[i] = d[i+1] = d[i+2] = g;
              }
              ctx.putImageData(id, 0, 0);
            } catch(_){}
            URL.revokeObjectURL(url);
            resolve(cv);
          } catch(e){ try { URL.revokeObjectURL(url); } catch(_){} resolve(file); }
        };
        img.onerror = function(){ try { URL.revokeObjectURL(url); } catch(_){} resolve(file); };
        img.src = url;
      } catch(e){ resolve(file); }
    });
  }

  // Parse nutrition-label values (per 100g) from OCR text. Table-aware, modeled on the scale
  // parser: numbers are tokenized with their column position + unit, each macro's label line
  // is located, and the value is read from the per-100g column (same / adjacent lines).
  // Handles 2-column tables (100g vs serving), kcal-vs-kJ, %DV columns, decimal commas, and
  // sub-rows (saturated fat / sugars). OCR is imperfect -> user reviews + Claude fallback.
  function parseFoodLabel(rawText){
    var text = (rawText || '').replace(/[٫،]/g, '.');
    text = text.replace(/(\d),(\d{1,2})(?!\d)/g, function(m0, a, b){ return a + '.' + b; });
    var lines = text.split(/\n+/).map(function(l){ return l.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
    function numTokens(line){
      var toks = [];
      var re = /(\d{1,4}(?:\.\d{1,2})?)\s*(kcal|kj|mg|g|%)?/gi;
      var m;
      while ((m = re.exec(line)) !== null){
        if (!m[1]){ re.lastIndex++; continue; }
        var v = parseFloat(m[1]);
        if (isNaN(v)) continue;
        toks.push({ val: v, center: m.index + m[0].length / 2, unit: (m[2] || '').toLowerCase() });
      }
      return toks;
    }
    // Determine which value column is per-100g from a header row listing two columns (e.g.
    // "ל-100 גרם" + "ל-30 גרם"): ordinal = position of the 100 value among the header numbers.
    // If the header has only the 100 column (or none), ordinal stays -1 and we take the largest
    // in-range value on the row (per-100g is usually the larger of 100g vs serving).
    var ordinal = -1;
    for (var hI = 0; hI < lines.length; hI++){
      var lh = lines[hI].toLowerCase();
      if (lh.indexOf('100') < 0) continue;
      if (lh.indexOf('גרם') < 0 && lh.indexOf('100g') < 0 && lh.indexOf('100 g') < 0 && lh.indexOf('ml') < 0 && lh.indexOf('מ\"ל') < 0 && lh.indexOf('מל') < 0) continue;
      var ht = numTokens(lines[hI]);
      if (ht.length >= 2){ for (var hj = 0; hj < ht.length; hj++){ if (ht[hj].val === 100){ ordinal = hj; break; } } }
      break;
    }
    function scan(keywords, o, strict){
      for (var i = 0; i < lines.length; i++){
        var low = lines[i].toLowerCase();
        var hit = false;
        for (var k = 0; k < keywords.length; k++){ if (low.indexOf(keywords[k].toLowerCase()) > -1){ hit = true; break; } }
        if (!hit) continue;
        if (strict && o.avoid){ var bad = false; for (var av = 0; av < o.avoid.length; av++){ if (low.indexOf(o.avoid[av].toLowerCase()) > -1){ bad = true; break; } } if (bad) continue; }
        var ts = numTokens(lines[i]).filter(function(x){
          if (x.unit === '%') return false;
          if (o.noKj && x.unit === 'kj') return false;
          return x.val >= o.min && x.val <= o.max;
        });
        if (!ts.length) continue;
        if (o.preferKcal){ var kc = ts.filter(function(x){ return x.unit === 'kcal'; }); if (kc.length) ts = kc; }
        if (ordinal >= 0 && ts.length > ordinal) return ts[ordinal].val;
        var best = ts[0].val;
        for (var b2 = 1; b2 < ts.length; b2++){ if (ts[b2].val > best) best = ts[b2].val; }
        return best;
      }
      return null;
    }
    function valueFor(keywords, o){ var v = scan(keywords, o, true); if (v == null) v = scan(keywords, o, false); return v; }
    var res = {};
    var cal  = valueFor(['קלוריות','אנרגיה','קלוריה','קק','energy','calorie','kcal'], {min:5, max:950, noKj:true, preferKcal:true});
    var prot = valueFor(['חלבונים','חלבון','protein'], {min:0, max:100});
    var fat  = valueFor(['שומנים','שומן','fat'], {min:0, max:100, avoid:['רווי','טראנס','trans','satur']});
    var carb = valueFor(['פחמימות','פחמימה','carbohydrate','carbs','carb'], {min:0, max:100, avoid:['סוכר','מהן','מתוכם','sugar']});
    if (cal  != null) res.cal_per_100g     = cal;
    if (prot != null) res.protein_per_100g = prot;
    if (fat  != null) res.fat_per_100g     = fat;
    if (carb != null) res.carbs_per_100g   = carb;
    return res;
  }

  // Full product-photo pipeline: image -> OCR -> parseFoodLabel -> fill the modal fields.
  async function runProductOCR(file){
    var statusEl = document.getElementById('apOcrStatus');
    var setStatus = function(msg){ if (statusEl){ statusEl.style.display = 'block'; statusEl.textContent = msg; } };
    try { var pv = document.getElementById('apPreview'); if (pv){ pv.src = URL.createObjectURL(file); pv.style.display = 'block'; } } catch(_){}
    try {
      setStatus('🔍 טוען מנוע OCR (פעם ראשונה ~30מב, סבלנות)...');
      var ocrSrc = file;
      try { ocrSrc = await prepImageForOCR(file); } catch(_){ ocrSrc = file; }
      var text = await extractTextFromImage(ocrSrc, function(p){
        if (p.status === 'recognizing text' && p.progress != null){ setStatus('🔍 מזהה טקסט... ' + Math.round(p.progress*100) + '%'); }
        else if (p.status){ setStatus('🔍 ' + p.status + '...'); }
      });
      var parsed = parseFoodLabel(text);
      var setv = function(id, v){ if (v != null){ var el = document.getElementById(id); if (el) el.value = v; } };
      var filled = 0;
      if (parsed.cal_per_100g     != null){ setv('apCal', parsed.cal_per_100g); filled++; }
      if (parsed.protein_per_100g != null){ setv('apP',   parsed.protein_per_100g); filled++; }
      if (parsed.fat_per_100g     != null){ setv('apF',   parsed.fat_per_100g); filled++; }
      if (parsed.carbs_per_100g   != null){ setv('apC',   parsed.carbs_per_100g); filled++; }
      var rawEl = document.getElementById('apOcrRaw');
      if (rawEl){ rawEl.value = text; var wrap = document.getElementById('apOcrRawWrap'); if (wrap) wrap.style.display = 'block'; }
      if (filled > 0){
        setStatus('✅ זוהו ' + filled + '/4 ערכים — השלם שם המוצר, בדוק/תקן ולחץ שמור');
        toast('✅ ' + filled + ' ערכים מולאו מהתווית', 3000);
      } else {
        setStatus('⚠️ לא זוהו ערכים מהתווית. מלא ידנית או דייק דרך Claude (למטה).');
        toast('⚠️ OCR לא זיהה — נסה דרך Claude', 4000);
      }
    } catch(e){
      console.error('Product OCR failed:', e);
      setStatus('⚠️ חילוץ נכשל: ' + (e.message || e) + ' — מלא ידנית או נסה דרך Claude.');
      toast('⚠️ OCR נכשל — נסה דרך Claude', 4000);
    }
  }

  function formatDate(d){
    if (!d) return '';
    const dt = typeof d === 'string' ? new Date(d) : d;
    return dt.toLocaleDateString('he-IL', { day:'2-digit', month:'2-digit', year:'numeric' });
  }
  function formatDateShort(d){
    const dt = typeof d === 'string' ? new Date(d) : d;
    return dt.toLocaleDateString('he-IL', { day:'2-digit', month:'2-digit' });
  }
  function calcBMI(w, h){
    if (!w || !h) return null;
    return (w / Math.pow(h/100, 2)).toFixed(1);
  }
  function calcBMR(w, h, age, male=true){
    if (!w || !h || !age) return null;
    return Math.round(10*w + 6.25*h - 5*age + (male?5:-161));
  }
  function calcTDEE(bmr, walkingKm=11, hasTraining=false){
    if (!bmr) return null;
    const walkCal = walkingKm * 70; // ~70 cal/km for 72kg person
    const trainCal = hasTraining ? 350 : 0;
    return Math.round(bmr * 1.2 + walkCal + trainCal);
  }
  function trendArrow(curr, prev){
    if (prev == null || curr == null) return {arrow:'·', cls:'flat'};
    const diff = curr - prev;
    if (Math.abs(diff) < 0.05) return {arrow:'·', cls:'flat'};
    if (diff > 0) return {arrow:'↑ '+diff.toFixed(1), cls:'up'};
    return {arrow:'↓ '+Math.abs(diff).toFixed(1), cls:'down'};
  }

  async function initSupabase(){
    if (!cfg.url || !cfg.key) return false;
    try {
      supa = createClient(cfg.url, cfg.key);
      return true;
    } catch(e) {
      console.error('Supabase init failed:', e);
      return false;
    }
  }

  async function loadAllData(){
    if (!supa) return;
    try {
      // Profile
      const { data: profile } = await supa.from('user_profile').select('*').limit(1).single();
      if (profile) state.profile = { ...state.profile, ...profile };

      // Latest metrics + history
      const { data: metrics } = await supa.from('body_metrics')
        .select('*').order('measured_at', {ascending:false}).limit(30);
      if (metrics && metrics.length){
        state.metricsHistory = metrics;
        state.latestMetrics = metrics[0];
      }

      // Pantry
      const { data: pantry } = await supa.from('pantry_items').select('*').order('name');
      state.pantry = pantry || [];

      // Latest menu
      const { data: menus } = await supa.from('weekly_menus')
        .select('*').order('week_start', {ascending:false}).limit(1);
      if (menus && menus[0]) state.currentMenu = menus[0];

      // Recent coach messages
      const { data: msgs } = await supa.from('coach_messages')
        .select('*').order('created_at', {ascending:false}).limit(50);
      state.coachMessages = msgs || [];

      // Foods (nutrition database)
      const { data: foods } = await supa.from('foods').select('*').order('name_he');
      state.foods = foods || [];

      // Daily menus (last 30 days)
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
      const { data: menus2 } = await supa.from('daily_menus')
        .select('*').gte('menu_date', cutoff.toISOString().slice(0,10))
        .order('menu_date', {ascending:false});
      state.dailyMenus = {};
      (menus2 || []).forEach(m => { state.dailyMenus[m.menu_date] = m; });

      // Blood tests
      const { data: blood } = await supa.from('blood_tests')
        .select('*').order('test_date', {ascending:false}).limit(30);
      state.bloodTests = blood || [];

      // Knowledge base (cross-session insights from past chats)
      const { data: kb } = await supa.from('knowledge_base')
        .select('*').order('priority', {ascending:false});
      state.knowledgeBase = kb || [];

      // Workout overrides come from user_profile.workout_overrides JSON column,
      // but we keep them in localStorage for now (no schema change required).

      // Cache to localStorage for offline use
      saveLocalCache();

    } catch(e) {
      console.error('loadAllData failed:', e);
      toast('שגיאה בטעינת נתונים - בודק חיבור Supabase');
    }
  }

  async function saveMetric(data){
    if (!supa) { toast('Supabase לא מחובר'); return false; }
    const enriched = {
      ...data,
      bmi: calcBMI(data.weight, state.profile.height_cm),
      bmr: calcBMR(data.weight, state.profile.height_cm, state.profile.age),
    };
    const { error } = await supa.from('body_metrics').insert(enriched);
    if (error) { console.error(error); toast('שגיאה בשמירה'); return false; }
    await loadAllData();
    return true;
  }

  async function savePantry(items){
    if (!supa) return false;
    // Upsert each
    for (const it of items){
      if (it.id){
        await supa.from('pantry_items').update({in_stock:it.in_stock, updated_at:new Date()}).eq('id', it.id);
      } else {
        await supa.from('pantry_items').insert({name:it.name, category:it.cat, in_stock:it.in_stock !== false});
      }
    }
    await loadAllData();
    return true;
  }

  async function saveCoachMessage(persona, promptText, response, snapshot){
    const msg = {
      persona, prompt_sent:promptText, response, context_snapshot:snapshot,
      created_at: new Date().toISOString(),

    <div class="btn-row mt-3">
      <button class="btn" id="btnCopyPrompt">📋 1. העתק</button>

    </div>

      const copyBtn = document.getElementById('btnCopyPrompt');

        copyBtn.addEventListener('click', async () => {
          ta.removeAttribute('readonly');
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, 999999);

          catch(e){ try { ok = document.execCommand('copy'); } catch(_){} }

  // Save daily menu (upsert by menu_date)
  async function saveDailyMenu(dateStr, items, notes){
    const totals = calcMenuTotals(items);
    const record = {
      menu_date: dateStr,
      items: items,
      total_calories: totals.cal,
      total_protein:  totals.protein,
      total_fat:      totals.fat,
      total_carbs:    totals.carbs,
      notes: notes || null,
      updated_at: new Date().toISOString(),
    };
    state.dailyMenus[dateStr] = record;
    saveLocalCache();
    if (!supa) return true; // local-only
    const { error } = await supa.from('daily_menus').upsert(record, { onConflict: 'menu_date' });
    if (error) { console.error(error); toast('שגיאה בשמירה: '+error.message); return false; }
    return true;
  }

  // Save blood test (insert or update)
  async function saveBloodTest(record){
    if (!supa) { toast('Supabase לא מחובר'); return false; }
    const op = record.id
      ? supa.from('blood_tests').update(record).eq('id', record.id)
      : supa.from('blood_tests').insert(record);
    const { data, error } = await op.select().single();
    if (error) { console.error(error); toast('שגיאה: '+error.message); return false; }
    // Refresh local cache
    if (record.id) {
      const idx = state.bloodTests.findIndex(b => b.id === record.id);
      if (idx >= 0) state.bloodTests[idx] = data;
    } else {
      state.bloodTests.unshift(data);
    }
    saveLocalCache();
    return data;
  }

    state.foods.unshift(food);
    saveLocalCache();
    if (!supa) return true;
    const { data, error } = await supa.from('foods').insert(food).select().single();
    if (error) { console.error(error); toast('שגיאה: '+error.message); return false; }
    food.id = data.id;
    return true;
  }

  // ============================================================
  // FOOD / MENU CALCULATIONS
  // ============================================================
  // items: [{food_id, food_name, grams, meal}]
  function calcMenuTotals(items){
    const totals = { cal:0, protein:0, fat:0, carbs:0 };
    if (!Array.isArray(items)) return totals;
    const foodsMap = new Map();
    [...state.foods, ...FALLBACK_FOODS].forEach(f => {
      if (f.id != null) foodsMap.set('id:'+f.id, f);
      foodsMap.set('name:'+f.name_he, f);
    });
    items.forEach(it => {
      const grams = parseFloat(it.grams) || 0;
      const factor = grams / 100;
      let food = null;
      if (it.food_id != null) food = foodsMap.get('id:'+it.food_id);
      if (!food && it.food_name) food = foodsMap.get('name:'+it.food_name);
      if (food){
        totals.cal     += (parseFloat(food.cal_per_100g)||0) * factor;
        totals.protein += (parseFloat(food.protein_per_100g)||0) * factor;
        totals.fat     += (parseFloat(food.fat_per_100g)||0) * factor;
        totals.carbs   += (parseFloat(food.carbs_per_100g)||0) * factor;
      } else if (it.cal != null) {
        // Custom item with hardcoded nutritional values
        totals.cal     += parseFloat(it.cal)     || 0;
        totals.protein += parseFloat(it.protein) || 0;
        totals.fat     += parseFloat(it.fat)     || 0;
        totals.carbs   += parseFloat(it.carbs)   || 0;
      }
    });
    return {
      cal:     Math.round(totals.cal),
      protein: Math.round(totals.protein * 10) / 10,
      fat:     Math.round(totals.fat * 10) / 10,
      carbs:   Math.round(totals.carbs * 10) / 10,
    };
  }

  // Get menu for a specific date - uses dailyMenus override, falls back to DEFAULT_MENU template
  function getMenuForDate(dateStr){
    if (state.dailyMenus[dateStr]) return { custom: true, ...state.dailyMenus[dateStr] };
    // Fallback: DEFAULT_MENU template
    const d = new Date(dateStr);
    const dayNames = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const dayName = dayNames[d.getDay()];
    const template = DEFAULT_MENU.days.find(x => x.day === dayName);
    return { custom: false, template, menu_date: dateStr };
  }

  // Get workouts (override or default)
  function getWorkoutForDay(dayName){
    if (state.workoutOverrides[dayName]) return { custom: true, day: dayName, exercises: state.workoutOverrides[dayName] };
    const def = DEFAULT_WORKOUTS.find(w => w.day === dayName);
    return def ? { custom: false, ...def } : null;
  }

  function saveWorkoutOverride(dayName, exercises){
    state.workoutOverrides[dayName] = exercises;
    saveLocalCache();
    // Future: save to DB. For now localStorage is enough since DEFAULT_WORKOUTS lives in code.
    return true;
  }

  function escapeHtml(str){
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function knowledgeForPersona(persona){
    const map = {
      dietitian: ['diet', 'health', 'general'],
      trainer:   ['workouts', 'health', 'general'],
      doctor:    ['health', 'medical', 'general'],
      team:      ['diet', 'workouts', 'health', 'medical', 'general'],
    };
    const allowed = map[persona] || ['general'];
    return (state.knowledgeBase || [])
      .filter(k => k.is_active !== false)
      .filter(k => allowed.includes(k.category || 'general'))
      .sort((a,b) => (b.priority||5) - (a.priority||5))
      .slice(0, 15);
  }

  function buildKnowledgeSection(persona){
    const items = knowledgeForPersona(persona);

      items.map(k => `• [${k.source_name}] ${k.title}: ${k.summary}`).join('\n');
  }

  // ============================================================
  // BYOC: PROMPT BUILDERS
  // ============================================================
  function buildContextSnapshot(){
    const m = state.latestMetrics;
    const profile = state.profile;

    // Pantry in stock
    const pantryMap = new Map();
    DEFAULT_PANTRY.forEach(p => pantryMap.set(p.name, { name: p.name, in_stock: true }));
    state.pantry.forEach(p => {
      if (pantryMap.has(p.name)) pantryMap.set(p.name, {...pantryMap.get(p.name), in_stock: p.in_stock});
      else pantryMap.set(p.name, { name: p.name, in_stock: p.in_stock !== false });
    });
    const pantryIn = Array.from(pantryMap.values()).filter(p => p.in_stock !== false).map(p => p.name);

    // Last 7 days menu - prefer custom daily_menus, fallback to template
    const today = new Date();
    const dayNames = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const recent7 = [];
    for (let i = 6; i >= 0; i--){
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const dateStr = d.toISOString().slice(0,10);
      const menu = getMenuForDate(dateStr);
      if (menu.custom && menu.items){
        recent7.push({
          date: dateStr,
          day: dayNames[d.getDay()],
          custom: true,
          items: menu.items.map(it => `${it.food_name} (${it.grams||0}g)`),
          cal: menu.total_calories,
          protein: menu.total_protein,
          fat: menu.total_fat,
          carbs: menu.total_carbs,
        });
      } else if (menu.template){
        recent7.push({
          date: dateStr,
          day: dayNames[d.getDay()],
          custom: false,
          lunch: menu.template.lunch,
          dinner: menu.template.dinner,
          cal_est: menu.template.cal,
          protein_est: menu.template.protein,
        });
      }
    }

    // Workouts plan (with overrides if exist)
    const workoutDays = ['ראשון','רביעי','שישי'];
    const workouts = workoutDays.map(d => {
      const w = getWorkoutForDay(d);
      return w ? {
        day: w.day,
        is_release: w.is_release,
        custom: w.custom,
        exercises: w.exercises.map(e => `${e.name} (${e.sets}×${e.reps}, ${e.muscle||''})`),
      } : null;
    }).filter(Boolean);

    // Blood tests - last 3 with analysis
    const recentBlood = (state.bloodTests || []).slice(0, 3).map(b => ({
      date: b.test_date,
      has_pdf: !!b.pdf_url,
      pdf_url: b.pdf_url,
      raw_text: b.raw_text || null,
      raw_text_method: b.raw_text_method || null,
      analysis: b.analysis ? b.analysis.substring(0, 1500) : null,
      notes: b.notes,
    }));

    return {
      profile: { age:profile.age, height_cm:profile.height_cm, diet_phase:profile.diet_phase,
                 target_weight:`${profile.target_weight_min}-${profile.target_weight_max}`,
                 target_bf:`${profile.target_bf_min}-${profile.target_bf_max}%` },
      latest_metrics: m ? {
        date: formatDate(m.measured_at),
        weight: m.weight,
        body_fat_pct: m.body_fat_pct,
        muscle_mass: m.muscle_mass,
        bmi: calcBMI(m.weight, profile.height_cm),
        bmr: calcBMR(m.weight, profile.height_cm, profile.age),
      } : null,
      pantry_in_stock: pantryIn,
      recent_7_days_menu: recent7,
      workouts_plan: workouts,
      blood_tests_recent: recentBlood,
      walking: '9-14 ק"מ ביום',
    };
  }

  // Read the live edit-menu form fields back into the stashed items, so add/remove
  // and save all preserve the user's in-progress edits (including free-text rows).
  function readEditMenuForm(){
    const s = JSON.parse(sessionStorage.getItem('hh_edit_menu') || '{}');
    const items = (s.items || []).map((it, i) => {
      const gEl = document.getElementById('emGrams' + i);
      const mEl = document.getElementById('emMeal' + i);
      const grams = (gEl && gEl.value !== '') ? parseFloat(gEl.value) : null;
      const meal = (mEl && mEl.value) || it.meal || 'lunch';
      const tEl = document.getElementById('emText' + i);
      if (tEl){
        return { food_id:null, food_name:tEl.value.trim(), grams:grams, meal:meal, freeText:true,
                 cal:(it.cal != null ? it.cal : null), protein:(it.protein != null ? it.protein : null) };
      }
      const fEl = document.getElementById('emFood' + i);
      const foodId = (fEl && fEl.value) ? parseInt(fEl.value) : null;
      const food = foodId ? state.foods.find(f => f.id === foodId) : null;
      return { food_id:foodId, food_name:(food ? food.name_he : ''), grams:grams, meal:meal, freeText:false };
    });
    s.items = items;
    const nEl = document.getElementById('emNotes');
    if (nEl) s.notes = nEl.value;
    sessionStorage.setItem('hh_edit_menu', JSON.stringify(s));
    return s;
  }

  async function handleAction(action, data){
    if (action.startsWith('byoc-')){
      const persona = action.replace('byoc-','');
      const promptText = persona === 'dietitian' ? buildDietitianPrompt()
                       : persona === 'trainer'   ? buildTrainerPrompt()
                       : persona === 'doctor'    ? buildDoctorPrompt()
                       : persona === 'product'   ? buildProductPrompt()
                       : buildTeamPrompt();
      sessionStorage.setItem('hh_prompt_'+persona, promptText);
      sessionStorage.setItem('hh_snapshot_'+persona, JSON.stringify(buildContextSnapshot()));
      // Try silent auto-copy in background (best effort, fail silently)
      copyToClipboard(promptText).catch(()=>{});
      // ALWAYS show modal so user sees the prompt + has clear 3-step flow
      // (Old flow opened window.open + auto-copy, but Chrome silently fails clipboard.writeText
      //  after focus moves to new tab, leaving Claude.ai empty and user confused.)
      showPromptFallback(promptText, persona);
      return;
    }

    if (action.startsWith('paste-')){
      const persona = action.replace('paste-','');

    if (action === 'save-metric'){

      `).join('');

        <h3 class="modal-title">🏋️ רישום אימון - ${escapeHtml(dayName)}</h3>
        <button class="modal-close" data-action="close-modal">×</button>

        <input type="date" id="wDate" value="${today}"></div>

        <select id="wRating">
          <option value="5">5 - מצוין</option>
          <option value="4" selected>4 - טוב</option>
          <option value="3">3 - בסדר</option>
          <option value="2">2 - חלש</option>
          <option value="1">1 - גרוע</option>
        </select></div>
      ${exHtml}
      <div class="form-row"><label class="form-label">הערות</label>
        <textarea id="wNotes" rows="2"></textarea></div>
      <div class="btn-row mt-3">
        <button class="btn" data-action="save-workout" data-day="${escapeHtml(dayName)}" data-release="${wPlan?.is_release?1:0}">💾 שמור</button>
        <button class="btn secondary" data-action="close-modal">ביטול</button>
      </div>`;
      showModal(html);
      return;
    }

    if (action === 'save-workout'){
      const dayName = data.day;
      const wPlan = DEFAULT_WORKOUTS.find(w => w.day === dayName);
      const exercises = (wPlan?.exercises || []).map((e, i) => ({
        name: e.name,
        planned: `${e.sets}×${e.reps}`,
        actual: $('#exDone'+i)?.value || '',
      }));
      const payload = {
        workout_date: $('#wDate').value,
        day_name: dayName,
        is_release: data.release === '1',
        exercises,
        rating: parseInt($('#wRating').value),
        notes: $('#wNotes').value.trim() || null,
      };
      if (!supa){ toast('Supabase לא מחובר'); return; }
      const { error } = await supa.from('workout_log').insert(payload);
      if (error){ toast('שגיאה: '+error.message); return; }
      toast('✅ אימון נרשם!');
      closeModal();
      return;

    if (action === 'add-pantry'){
      const html = `<div class="modal-header">

        <select id="apCat">
          <option value="protein">🥩 חלבון</option>
          <option value="vegetable">🥦 ירקות</option>
          <option value="nut">🌰 אגוזים/זרעים</option>
          <option value="oil">🫒 שמנים</option>
          <option value="carb">🌾 פחמימות</option>
          <option value="dairy">🧀 חלב</option>
          <option value="other" selected>🧂 אחר</option>
        </select></div>
      <div class="btn-row mt-3">

        <button class="btn secondary" data-action="close-modal">ביטול</button>

      const newItem = { name, category: cat, in_stock: true };
      state.pantry.push(newItem);

        const { data: ins } = await supa.from('pantry_items').insert(newItem).select().single();

          newItem.id = ins.id;
          saveLocalCache();

      closeModal();
      renderMenu();

    if (action === 'edit-menu-day'){
      const dateStr = data.date;

      const existing = state.dailyMenus[dateStr];
      let items;
      if (existing && existing.items && existing.items.length){
        // A saved custom menu exists: load its items for editing.
        items = existing.items.map(it => ({...it}));
      } else {
        // No saved menu yet: seed the editor from the DEFAULT_MENU template so the
        // user edits the EXISTING plan instead of a blank form. Template meals are
        // free-text strings, so they become editable free-text rows (freeText:true).
        // The template cal/protein estimate is split across lunch/dinner so the
        // calorie total is preserved (calcMenuTotals reads it.cal when present).
        const tmpl = DEFAULT_MENU.days.find(d => d.day === dayName) || null;
        items = [];
        if (tmpl){
          const halfCal  = tmpl.cal != null ? Math.round(tmpl.cal / 2) : null;
          const halfProt = tmpl.protein != null ? Math.round(tmpl.protein / 2) : null;
          if (tmpl.lunch)  items.push({food_id:null, food_name:tmpl.lunch,  grams:null, meal:'lunch',  freeText:true, cal:halfCal, protein:halfProt});
          if (tmpl.dinner) items.push({food_id:null, food_name:tmpl.dinner, grams:null, meal:'dinner', freeText:true, cal:(tmpl.cal!=null?tmpl.cal-(halfCal||0):null), protein:(tmpl.protein!=null?tmpl.protein-(halfProt||0):null)});
        }
      }
      const notes = (existing && existing.notes) ? existing.notes : '';
      // Stash in sessionStorage so add/remove buttons can mutate it
      sessionStorage.setItem('hh_edit_menu', JSON.stringify({dateStr, dayName, items, notes}));
      renderEditMenuModal();
      return;
    }

      const s = readEditMenuForm();
      s.items = s.items || [];
      s.items.push({food_id:null, food_name:'', grams:100, meal:'lunch', freeText:false});
      sessionStorage.setItem('hh_edit_menu', JSON.stringify(s));

      const s = readEditMenuForm();
      s.items = s.items || [];
      s.items.push({food_id:null, food_name:'', grams:null, meal:'lunch', freeText:true});
      sessionStorage.setItem('hh_edit_menu', JSON.stringify(s));
      renderEditMenuModal();
      return;

      s.items.splice(idx, 1);

      renderEditMenuModal();
      return;

      s.items = (s.items || []).filter(it => it.freeText ? !!it.food_name : (it.food_name && it.grams > 0));

      const ok = await saveDailyMenu(s.dateStr, s.items, notes);
      if (ok){
        toast('✅ נשמר! (פריטי טקסט חופשי לא נספרים בקלוריות)');
        sessionStorage.removeItem('hh_edit_menu');
        closeModal();
        renderCurrentScreen();
      }
      return;

    if (action === 'edit-menu-delete'){
      const state2 = JSON.parse(sessionStorage.getItem('hh_edit_menu') || '{}');
      if (!confirm(`למחוק את התפריט של ${state2.dateStr}?`)) return;
      delete state.dailyMenus[state2.dateStr];
      saveLocalCache();
      if (supa){
        await supa.from('daily_menus').delete().eq('menu_date', state2.dateStr);

      sessionStorage.removeItem('hh_edit_menu');
      closeModal();
      renderCurrentScreen();
      return;

        <h3 class="modal-title">➕ הוסף מאכל מותאם</h3>
        <button class="modal-close" data-action="close-modal">×</button>

      <div class="form-row"><label class="form-label">שם בעברית</label><input type="text" id="cfName" placeholder="לדוגמה: שניצל"></div>

          ${Object.entries(FOOD_CATEGORIES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}

      <div class="form-row"><label class="form-label">קלוריות / 100g</label><input type="number" id="cfCal" step="1"></div>

      <div class="form-row"><label class="form-label">שומן (g) / 100g</label><input type="number" id="cfF" step="0.1"></div>
      <div class="form-row"><label class="form-label">פחמימות (g) / 100g</label><input type="number" id="cfC" step="0.1"></div>
      <div class="btn-row mt-3">
        <button class="btn" data-action="save-custom-food">💾 הוסף</button>
        <button class="btn secondary" data-action="close-modal">ביטול</button>
      </div>`;
      showModal(html);
      setTimeout(()=>$('#cfName')?.focus(), 100);
      return;
    }
    if (action === 'save-custom-food'){
      const name = $('#cfName').value.trim();
      const cal = parseFloat($('#cfCal').value);
      if (!name || !cal){ toast('שם + קלוריות חובה'); return; }

        name_he: name,
        category: $('#cfCat').value,
        cal_per_100g: cal,
        protein_per_100g: parseFloat($('#cfP').value) || 0,
        fat_per_100g: parseFloat($('#cfF').value) || 0,

      };

        toast('✅ נוסף למאגר');
        closeModal();
        renderCurrentScreen();

      return;

    // ==================== ADD FOOD FROM PHOTO (camera/upload -> local OCR -> DB) ====================
    if (action === 'analyze-product'){
      renderProductModal();
      return;
    }
    if (action === 'copy-product-prompt'){
      const ok = await copyToClipboard(buildProductPrompt());
      toast(ok ? '✅ הפרומפט הועתק! פתח Claude, הדבק והעלה צילום של האריזה' : '⚠️ העתקה נכשלה - נסה שוב', 3500);
      return;
    }
    if (action === 'fill-product-from-json'){
      const elR = document.getElementById('apResponse');
      const text = elR && elR.value ? elR.value.trim() : '';
      if (!text){ toast('הדבק קודם JSON מ-Claude'); return; }
      const a = text.indexOf('{');
      const b = text.lastIndexOf('}');
      if (a < 0 || b < 0 || b < a){ toast('לא נמצא JSON תקין'); return; }
      let json;
      try { json = JSON.parse(text.slice(a, b + 1)); }
      catch(e){ toast('שגיאת JSON: ' + e.message); return; }
      const setv = function(id, v){ if (v != null){ const el = document.getElementById(id); if (el) el.value = v; } };
      if (json.name_he != null) setv('apName', String(json.name_he));
      if (json.category != null){ const c = document.getElementById('apCat'); if (c) c.value = json.category; }
      setv('apCal', json.cal_per_100g);
      setv('apP', json.protein_per_100g);
      setv('apF', json.fat_per_100g);
      setv('apC', json.carbs_per_100g);
      toast('✅ השדות מולאו - בדוק/תקן ולחץ שמור', 3500);

      const cal = parseFloat(calRaw);
      if (!name){ toast('שם המוצר חובה'); return; }
      if (calRaw === '' || isNaN(cal)){ toast('קלוריות הן שדה חובה'); return; }
      const catEl = document.getElementById('apCat');
      const food = {
        name_he: name,
        category: catEl ? catEl.value : 'sweets',
        cal_per_100g: cal,
        protein_per_100g: parseFloat(gv('apP')) || 0,
        fat_per_100g: parseFloat(gv('apF')) || 0,
        carbs_per_100g: parseFloat(gv('apC')) || 0,
      };
      const ok = await saveCustomFood(food);
      if (!ok){ return; }
      const grams = parseFloat(gv('apGrams'));
      const mealEl = document.getElementById('apMeal');
      const meal = mealEl ? mealEl.value : '';
      if (grams > 0 && meal){
        const today = new Date().toISOString().slice(0,10);
        const existing = state.dailyMenus[today] || { items: [] };
        const items = (existing.items || []).slice();
        items.push({ food_id: food.id || null, food_name: food.name_he, grams: grams, meal: meal });
        await saveDailyMenu(today, items, existing.notes || null);
        toast('✅ ' + food.name_he + ' נשמר + הוסף ' + grams + 'g ליום היום', 3500);
      } else {
        toast('✅ ' + food.name_he + ' נשמר במאגר', 3000);
      }
      closeModal();
      renderCurrentScreen();
      return;
    }

    if (action === 'show-food'){
      const id = parseInt(data.foodId);
      const f = state.foods.find(x => x.id === id);
      if (!f) return;
      const html = `<div class="modal-header">
        <h3 class="modal-title">${escapeHtml(f.name_he)}</h3>
        <button class="modal-close" data-action="close-modal">×</button>
      </div>
      <div class="text-xs text-dim mb-2">${FOOD_CATEGORIES[f.category]||f.category} ${f.is_custom?' · מותאם אישית':''}</div>
      <div class="status-grid">
        <div class="status-tile"><div class="status-label">קלוריות</div><div class="status-value">${Math.round(f.cal_per_100g)}<span class="status-unit">/100g</span></div></div>
        <div class="status-tile"><div class="status-label">חלבון</div><div class="status-value">${f.protein_per_100g}<span class="status-unit">g</span></div></div>
        <div class="status-tile"><div class="status-label">שומן</div><div class="status-value">${f.fat_per_100g}<span class="status-unit">g</span></div></div>
        <div class="status-tile"><div class="status-label">פחמימות</div><div class="status-value">${f.carbs_per_100g}<span class="status-unit">g</span></div></div>
      </div>
      <div class="btn-row mt-3">
        <button class="btn secondary" data-action="close-modal">סגור</button>
      </div>`;
      showModal(html);
      return;
    }

    // ==================== EDIT WORKOUT ====================
    if (action === 'edit-workout'){
      const dayName = data.day;
      const w = getWorkoutForDay(dayName);
      const exercises = w ? [...w.exercises.map(e => ({...e}))] : [];
      sessionStorage.setItem('hh_edit_workout', JSON.stringify({dayName, exercises}));
      renderEditWorkoutModal();
      return;
    }
    if (action === 'edit-workout-add'){
      const s = JSON.parse(sessionStorage.getItem('hh_edit_workout') || '{}');
      s.exercises = s.exercises || [];
      s.exercises.push({name:'', sets:3, reps:'10', muscle:''});
      sessionStorage.setItem('hh_edit_workout', JSON.stringify(s));
      renderEditWorkoutModal();
      return;
    }
    if (action === 'edit-workout-remove'){
      const idx = parseInt(data.idx);
      const s = JSON.parse(sessionStorage.getItem('hh_edit_workout') || '{}');
      s.exercises.splice(idx, 1);
      sessionStorage.setItem('hh_edit_workout', JSON.stringify(s));
      renderEditWorkoutModal();
      return;
    }
    if (action === 'edit-workout-save'){
      const s = JSON.parse(sessionStorage.getItem('hh_edit_workout') || '{}');
      s.exercises = s.exercises.map((_, i) => ({
        name:   $(`#ewName${i}`)?.value?.trim() || '',
        sets:   parseInt($(`#ewSets${i}`)?.value) || 0,
        reps:   $(`#ewReps${i}`)?.value?.trim() || '',
        muscle: $(`#ewMuscle${i}`)?.value?.trim() || '',
      })).filter(e => e.name);
      saveWorkoutOverride(s.dayName, s.exercises);
      toast('✅ האימון נשמר');
      sessionStorage.removeItem('hh_edit_workout');
      closeModal();
      renderCurrentScreen();
      return;
    }
    if (action === 'edit-workout-reset'){
      const s = JSON.parse(sessionStorage.getItem('hh_edit_workout') || '{}');
      if (!confirm(`לאפס את אימון ${s.dayName} לברירת המחדל?`)) return;
      delete state.workoutOverrides[s.dayName];
      saveLocalCache();
      toast('🔄 אופס לברירת מחדל');
      sessionStorage.removeItem('hh_edit_workout');
      closeModal();
      renderCurrentScreen();
      return;
    }

    // ==================== BLOOD TESTS ====================
    if (action === 'upload-blood'){
      const html = `<div class="modal-header">
        <h3 class="modal-title">🩸 העלאת בדיקת דם</h3>
        <button class="modal-close" data-action="close-modal">×</button>
      </div>
      <div class="text-xs text-dim mb-2">העלה PDF של תוצאות בדיקה. אחרי השמירה: לחץ "קבל ניתוח" בדף בדיקות הדם.</div>
      <div class="form-row"><label class="form-label">תאריך הבדיקה *</label>
        <input type="date" id="btDate" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-row"><label class="form-label">קובץ PDF *</label>
        <input type="file" id="btFile" accept="application/pdf,image/*"></div>
      <div class="form-row"><label class="form-label">הערות (אופציונלי)</label>
        <textarea id="btNotes" rows="2" placeholder="לדוגמה: בדיקה שגרתית, נטילת ויטמין D החלה לפני 3 חודשים..."></textarea></div>
      <div class="hint-box text-xs">
        💡 ה-PDF נשמר ב-Supabase Storage כקובץ ציבורי. Claude יוכל לקרוא אותו דרך URL.
      </div>
      <div class="btn-row mt-3">
        <button class="btn" data-action="save-blood">💾 העלה ושמור</button>
        <button class="btn secondary" data-action="close-modal">ביטול</button>
      </div>`;
      showModal(html);
      return;
    }
    if (action === 'save-blood'){
      const date = $('#btDate').value;
      const file = $('#btFile').files[0];
      const notes = $('#btNotes').value.trim() || null;
      if (!date || !file){ toast('תאריך + קובץ הם חובה'); return; }
      toast('📤 מעלה את הקובץ...', 1500);
      const uploaded = await uploadBloodTestPDF(file);
      if (!uploaded){ return; }
      const record = {
        test_date: date,
        pdf_url: uploaded.url,
        pdf_filename: uploaded.fileName,
        notes,
      };
      const saved = await saveBloodTest(record);
      if (saved){
        toast('✅ הועלה! מתחיל חילוץ טקסט אוטומטי...', 2500);
        closeModal();
        renderCurrentScreen();
        // Auto-extract text in background (PDF.js → OCR fallback)
        try {
          const result = await extractTextFromPDF(uploaded.url, (p) => {
            if (p.phase === 'ocr' && p.page){
              const pct = p.progress ? Math.round(p.progress*100) : 0;
              toast(`🔍 OCR עמוד ${p.page}/${p.total} (${pct}%)`, 1200);
            } else if (p.status){
              toast(`📄 ${p.status}`, 1200);
            }
          });
          await saveBloodTest({
            ...saved,
            raw_text: result.text,
            raw_text_method: result.method,
            raw_text_extracted_at: new Date().toISOString(),
          });
          toast(`✅ טקסט חולץ! ${result.text.length} תווים (${result.method === 'pdfjs' ? 'PDF דיגיטלי' : 'OCR'}). לחץ "קבל ניתוח"`, 4000);
          renderCurrentScreen();
        } catch (e) {
          console.error('OCR failed:', e);
          toast(`⚠️ חילוץ טקסט נכשל: ${e.message}. תוכל ללחוץ "🔄 חלץ שוב".`, 5000);
        }
      }
      return;
    }
    if (action === 'extract-blood-text'){
      const id = parseInt(data.bloodId);
      const t = state.bloodTests.find(b => b.id === id);
      if (!t || !t.pdf_url){ toast('אין PDF לחלץ'); return; }
      toast('🔍 מתחיל חילוץ טקסט...', 2000);
      try {
        const result = await extractTextFromPDF(t.pdf_url, (p) => {
          if (p.phase === 'ocr' && p.page){
            const pct = p.progress ? Math.round(p.progress*100) : 0;
            toast(`🔍 OCR עמוד ${p.page}/${p.total} (${pct}%)`, 1200);
          } else if (p.status){
            toast(`📄 ${p.status}`, 1200);
          }
        });
        await saveBloodTest({
          ...t,
          raw_text: result.text,
          raw_text_method: result.method,
          raw_text_extracted_at: new Date().toISOString(),
        });
        toast(`✅ טקסט חולץ! ${result.text.length} תווים (${result.method === 'pdfjs' ? 'PDF דיגיטלי' : 'OCR'})`, 4000);
        renderCurrentScreen();
      } catch (e) {
        console.error('OCR failed:', e);
        toast(`⚠️ שגיאה: ${e.message}`, 5000);
      }
      return;
    }
    if (action === 'view-blood'){
      const id = parseInt(data.bloodId);
      const t = state.bloodTests.find(b => b.id === id);
      if (!t) return;
      const html = `<div class="modal-header">
        <h3 class="modal-title">🩸 בדיקת דם - ${formatDate(t.test_date)}</h3>
        <button class="modal-close" data-action="close-modal">×</button>
      </div>
      ${t.pdf_url ? `<div class="btn-row mt-3">
        <a href="${escapeHtml(t.pdf_url)}" target="_blank" class="btn" style="text-decoration:none;background:#dc2626;flex:1">📄 פתח PDF</a>
        <button class="btn secondary" data-action="extract-blood-text" data-blood-id="${t.id}" style="flex:1">${t.raw_text ? '🔄 חלץ שוב' : '🔍 חלץ טקסט'}</button>
      </div>` : ''}
      ${t.raw_text ? `<details class="mt-3"><summary style="cursor:pointer;color:var(--accent-2);font-size:13px">📝 טקסט מחולץ (${t.raw_text.length.toLocaleString()} תווים, ${t.raw_text_method === 'pdfjs' ? 'PDF דיגיטלי' : 'OCR'})</summary>
        <pre style="white-space:pre-wrap;font-size:11px;background:var(--bg);padding:10px;border-radius:8px;max-height:300px;overflow:auto;margin-top:8px">${escapeHtml(t.raw_text.substring(0, 3000))}${t.raw_text.length > 3000 ? '\n\n...(מקוצצ)' : ''}</pre></details>` : ''}
      ${t.notes ? `<div class="text-sm mt-3"><strong>הערות:</strong><br>${escapeHtml(t.notes)}</div>` : ''}
      ${t.analysis ? `<div class="mt-3"><strong class="text-sm">🩺 ניתוח ד"ר שמיר (${formatDate(t.analysis_date)}):</strong>
        <div style="white-space:pre-wrap;line-height:1.6;font-size:14px;margin-top:8px">${escapeHtml(t.analysis)}</div></div>`
        : '<div class="text-sm text-dim mt-3">⏳ עדיין לא נותחה. חזור לדף הראשי ולחץ "קבל ניתוח"</div>'}
      <button class="btn secondary mt-3" data-action="close-modal">סגור</button>`;
      showModal(html);
      return;
    }
    if (action === 'delete-blood'){
      const id = parseInt(data.bloodId);
      if (!confirm('למחוק את בדיקת הדם?')) return;
      const t = state.bloodTests.find(b => b.id === id);
      state.bloodTests = state.bloodTests.filter(b => b.id !== id);
      saveLocalCache();
      if (supa){
        await supa.from('blood_tests').delete().eq('id', id);
        if (t?.pdf_filename){
          await supa.storage.from('blood-tests').remove([t.pdf_filename]);
        }
      }
      toast('🗑️ נמחק');
      renderCurrentScreen();
      return;
    }

    // ==================== KNOWLEDGE BASE ====================
    if (action === 'toggle-kb-inactive'){
      const cur = sessionStorage.getItem('hh_kb_show_inactive') === '1';
      sessionStorage.setItem('hh_kb_show_inactive', cur ? '0' : '1');
      renderKnowledge();
      return;
    }
    if (action === 'add-knowledge' || action === 'edit-knowledge'){
      const id = data.kbId ? parseInt(data.kbId) : null;
      const e = id ? (state.knowledgeBase.find(k => k.id === id) || {}) : {};
      const html = `<div class="modal-header">
        <h3 class="modal-title">${id ? '✏️ עריכת ידע' : '➕ הוסף ידע חדש'}</h3>
        <button class="modal-close" data-action="close-modal">×</button>
      </div>
      <div class="text-xs text-dim mb-2">הידע יזרום אוטומטי ל-AI personas הרלבנטיים לפי הקטגוריה</div>
      <div class="form-row"><label class="form-label">מקור (שם הצ׳אט/התייעצות)</label>
        <input type="text" id="kbSource" value="${escapeHtml(e.source_name||'')}" placeholder="לדוגמה: דיאטת קיטו"></div>
      <div class="form-row"><label class="form-label">כותרת</label>
        <input type="text" id="kbTitle" value="${escapeHtml(e.title||'')}" placeholder="כותרת קצרה של התובנה"></div>
      <div class="form-row"><label class="form-label">קטגוריה</label>
        <select id="kbCategory">
          ${Object.entries(KNOWLEDGE_CATEGORIES).map(([k,v]) => `<option value="${k}" ${(e.category||'general')===k?'selected':''}>${v}</option>`).join('')}
        </select></div>
      <div class="form-row"><label class="form-label">תקציר (זה מה שיזרום ל-AI)</label>
        <textarea id="kbSummary" rows="6" placeholder="תיאור קצר התובנה...">${escapeHtml(e.summary||'')}</textarea></div>
      <div class="form-row"><label class="form-label">עדיפות (1-10)</label>
        <input type="number" id="kbPriority" value="${e.priority||5}" min="1" max="10"></div>
      <div class="form-row"><label class="form-label">URL מקור (אופציונלי)</label>
        <input type="text" id="kbUrl" value="${escapeHtml(e.source_url||'')}" placeholder="https://claude.ai/chat/..."></div>
      <div class="btn-row mt-3">
        <button class="btn" data-action="save-knowledge" data-kb-id="${id||''}">💾 שמור</button>
        <button class="btn secondary" data-action="close-modal">ביטול</button>
      </div>`;
      showModal(html);
      setTimeout(()=>$('#kbTitle')?.focus(), 100);
      return;
    }
    if (action === 'save-knowledge'){
      const id = data.kbId ? parseInt(data.kbId) : null;
      const record = {
        source_name: $('#kbSource').value.trim() || 'ידני',
        title: $('#kbTitle').value.trim(),
        category: $('#kbCategory').value,
        summary: $('#kbSummary').value.trim(),
        priority: parseInt($('#kbPriority').value) || 5,
        source_url: $('#kbUrl').value.trim() || null,
        is_active: true,
      };
      if (!record.title || !record.summary){ toast('כותרת + תקציר חובה'); return; }
      if (supa){
        const op = id
          ? supa.from('knowledge_base').update({...record, updated_at: new Date().toISOString()}).eq('id', id)
          : supa.from('knowledge_base').insert(record);
        const { data: saved, error } = await op.select().single();
        if (error){ toast('שגיאה: '+error.message); return; }
        if (id){
          const idx = state.knowledgeBase.findIndex(k => k.id === id);
          if (idx >= 0) state.knowledgeBase[idx] = saved;
        } else {
          state.knowledgeBase.unshift(saved);
        }
      } else {
        if (id){
          const idx = state.knowledgeBase.findIndex(k => k.id === id);
          if (idx >= 0) state.knowledgeBase[idx] = {...state.knowledgeBase[idx], ...record};
        } else {
          state.knowledgeBase.unshift({...record, id: Date.now()});
        }
      }
      saveLocalCache();
      toast(id ? '✅ עודכן' : '✅ נוסף');
      closeModal();
      renderCurrentScreen();
      return;
    }
    if (action === 'toggle-knowledge'){
      const id = parseInt(data.kbId);
      const e = state.knowledgeBase.find(k => k.id === id);
      if (!e) return;
      e.is_active = e.is_active === false ? true : false;
      saveLocalCache();
      if (supa){
        await supa.from('knowledge_base').update({is_active: e.is_active}).eq('id', id);
      }
      toast(e.is_active ? '✅ הידע הופעל' : '🌙 הידע הושבת');
      renderKnowledge();
      return;
    }
    if (action === 'delete-knowledge'){
      const id = parseInt(data.kbId);
      if (!confirm('למחוק את התובנה?')) return;
      state.knowledgeBase = state.knowledgeBase.filter(k => k.id !== id);
      saveLocalCache();
      if (supa){
        await supa.from('knowledge_base').delete().eq('id', id);
      }
      toast('🗑️ נמחק');
      renderKnowledge();
      return;
    }
  }

        showModal(fullHtml);
      });
    });
  }

  async function saveSettings(){
    const url = $('#cfgUrl').value.trim();
    const key = $('#cfgKey').value.trim();
    const profileData = {
      age: parseFloat($('#pAge').value) || state.profile.age,
      height_cm: parseFloat($('#pHeight').value) || state.profile.height_cm,
      target_weight_min: parseFloat($('#pWmin').value) || state.profile.target_weight_min,
      target_weight_max: parseFloat($('#pWmax').value) || state.profile.target_weight_max,
      target_bf_min: parseFloat($('#pBfmin').value) || state.profile.target_bf_min,
      target_bf_max: parseFloat($('#pBfmax').value) || state.profile.target_bf_max,
      diet_phase: $('#pPhase').value,
    };
    // Always update local state + cache
    state.profile = { ...state.profile, ...profileData };
    saveLocalCache();

    // Save Supabase config
    if (url && key){
      cfg = { url, key };
      localStorage.setItem(LS_KEY_CFG, JSON.stringify(cfg));
      const ok = await initSupabase();
      if (ok){
        await loadAllData();
        // First-time setup: insert pantry defaults if empty
        if (!state.pantry.length){
          for (const p of DEFAULT_PANTRY){
            await supa.from('pantry_items').insert({name:p.name, category:p.cat, in_stock:true});
          }
          await loadAllData();
        }
        await saveProfile(profileData);
        toast('✅ Supabase מחובר ונתונים נטענו!');
      } else {
        toast('❌ שגיאה בחיבור Supabase - הפרופיל נשמר מקומית');
      }
    } else {
      toast('✅ פרופיל עודכן (Supabase לא מחובר)');
    }
    closeModal();
    renderCurrentScreen();
  }

  // ============================================================
  // SCREEN ROUTER
  // ============================================================
  function switchScreen(name){
    currentScreen = name;
    $$('.screen').forEach(s => s.classList.remove('active'));
    $('#screen-'+name).classList.add('active');
    $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
    renderCurrentScreen();
  }
  function renderCurrentScreen(){
    if (currentScreen === 'dashboard') renderDashboard();
    else if (currentScreen === 'menu') renderMenu();
    else if (currentScreen === 'workouts') renderWorkouts();
    else if (currentScreen === 'metrics') renderMetrics();
    else if (currentScreen === 'blood') renderBlood();
    else if (currentScreen === 'knowledge') renderKnowledge();
  }

  // ============================================================
  // EVENT DELEGATION
  // ============================================================
  document.addEventListener('click', async (e) => {
    // Tab switching
    const tab = e.target.closest('.tab-btn');
    if (tab) { switchScreen(tab.dataset.screen); return; }

    // Header buttons
    if (e.target.closest('#btnSettings')) { showSettings(); return; }
    if (e.target.closest('#btnHistory')) { showHistory(); return; }

    // Pantry toggle
    const pantryChip = e.target.closest('[data-pantry-toggle]');
    if (pantryChip){
      const name = pantryChip.dataset.name;
      const id = pantryChip.dataset.id;
      let item = state.pantry.find(p => (id && p.id == id) || p.name === name);
      if (!item){
        // Item from DEFAULT_PANTRY - convert to state item
        const def = DEFAULT_PANTRY.find(p => p.name === name);
        if (def){
          item = { name: def.name, category: def.cat, in_stock: false };
          state.pantry.push(item);
        }
      } else {
        item.in_stock = item.in_stock === false ? true : false;
      }
      saveLocalCache();
      if (id && supa) {
        await supa.from('pantry_items').update({in_stock:item.in_stock}).eq('id', id);
      } else if (!id && supa && item) {
        // First time toggle on default item - insert to Supabase
        const { data } = await supa.from('pantry_items').insert({
          name:item.name, category:item.category||'other', in_stock:item.in_stock
        }).select().single();
        if (data) item.id = data.id;
      }
      saveLocalCache();
      renderMenu();
      return;
    }

    // Generic actions
    const btn = e.target.closest('[data-action]');
    if (btn){
      const action = btn.dataset.action;
      const data = { ...btn.dataset };
      delete data.action;
      handleAction(action, data);
    }

    // Modal close on overlay
    if (e.target.id === 'modalOverlay') closeModal();
  });

  // Save settings handler (separate because of action name)
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-action="save-settings"]')) saveSettings();
  });

  // Auto-OCR on image select: scale screenshot (metricPhoto) -> runMetricOCR;
  // product label via camera (apPhotoCam) or gallery (apPhotoLib) -> runProductOCR.
  document.addEventListener('change', (e) => {
    if (!e.target) return;
    const id = e.target.id;
    if (id !== 'metricPhoto' && id !== 'apPhotoCam' && id !== 'apPhotoLib') return;
    const file = e.target.files && e.target.files[0];
    if (!(file && file.type && file.type.indexOf('image/') === 0)) return;
    if (id === 'metricPhoto') runMetricOCR(file);
    else runProductOCR(file);
  });

  // ============================================================
  // PWA: Service Worker registration (real same-origin file)
  // ============================================================
  function installPWA(){
    // Manifest + icons are real files linked statically in <head>.
    // The service worker MUST be a real same-origin file: Chromium REJECTS blob: URL SW
    // scripts (silent failure), which is why the install option never appeared. sw.js sits
    // at the repo root => served at /health-hub/sw.js with scope /health-hub/.
    if ('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('[HH] SW registered, scope:', reg.scope))
        .catch(err => console.warn('[HH] SW registration failed:', err));
    }
  }

  // ============================================================
  // INIT
  // ============================================================
  async function init(){
    try { installPWA(); } catch(e) { console.warn('PWA install skipped:', e); }
    if (cfg.url && cfg.key){
      const ok = await initSupabase();
      if (ok) await loadAllData();
    }
    renderDashboard();

    // Welcome on first launch
    if (!cfg.url){
      setTimeout(()=>{
        toast('👋 ברוך הבא! לחץ ⚙️ להגדרת Supabase', 4000);
      }, 600);
    }
  }

  init();
})();
</script>

<script>
/* ============================================================
   Health Hub PWA controller
   Install button - captures beforeinstallprompt, shows a visible button.
   App updates apply automatically (SW skipWaiting + network-first HTML), so
   no manual "refresh" banner is needed.
   Self-contained; does not touch the app IIFE.
   ============================================================ */
(function(){
  function mkPill(id, bg){
    var ex = document.getElementById(id);
    if (ex) return ex;
    var b = document.createElement('button');
    b.id = id; b.type = 'button';
    var s = b.style;
    s.position = 'fixed'; s.left = '50%'; s.transform = 'translateX(-50%)';
    s.zIndex = '99999'; s.padding = '12px 22px'; s.fontSize = '16px';
    s.fontWeight = '700'; s.color = '#ffffff'; s.background = bg; s.border = 'none';
    s.borderRadius = '999px'; s.boxShadow = '0 6px 20px rgba(0,0,0,0.28)';
    s.cursor = 'pointer'; s.fontFamily = 'inherit'; s.display = 'none';
    document.body.appendChild(b);
    return b;
  }

  /* ---- (1) INSTALL ---- */
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    var b = mkPill('hhInstallBtn', '#2563eb');
    b.textContent = '\uD83D\uDCF2 \u05d4\u05ea\u05e7\u05df \u05d0\u05e4\u05dc\u05d9\u05e7\u05e6\u05d9\u05d4';
    b.style.bottom = '18px';
    b.onclick = function(){
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){ deferredPrompt = null; b.style.display = 'none'; });
    };
    b.style.display = 'block';
  });
  window.addEventListener('appinstalled', function(){
    var b = document.getElementById('hhInstallBtn');
    if (b) b.style.display = 'none';
    deferredPrompt = null;
  });
})();
</script>
